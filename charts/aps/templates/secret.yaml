# secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apsSecret.name }}
type: Opaque
stringData:
  {{ .Values.apsSecret.redisKey }}: "redis://redis:6379"
  {{ .Values.apsSecret.jwtKey }}: "supersecretjwt"

---
# configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aps.fullname" . }}-config
data:
  LOG_LEVEL: "info"
  FEATURE_FLAG: "true"