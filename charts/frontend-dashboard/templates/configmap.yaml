apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ui.fullname" . }}-nginx-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy for your other repos/services
        # Note: DAS must be named "{{ .Release.Name }}-das" in its own chart
        location /api/ubs/ {
            proxy_pass http://{{ .Release.Name }}-user-billing-service:5000/;
        }
        location /api/das/ {
            proxy_pass http://{{ .Release.Name }}-data-api-service:8000/;
        }
        location /api/dis/ {
            proxy_pass http://{{ .Release.Name }}-data-ingest-service:8001/;
        }
    }