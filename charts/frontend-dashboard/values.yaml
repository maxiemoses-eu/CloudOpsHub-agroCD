replicaCount: 1

image:
  repository: 659591640509.dkr.ecr.us-west-2.amazonaws.com/cloudopshub-dis
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080 # This matches your Dockerfile EXPOSE 8080

# Aligned with the Deployment logic
probes:
  livenessPath: /
  readinessPath: /
  livenessInitialDelay: 5
  readinessInitialDelay: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Standard for ServiceAccount creation
serviceAccount:
  create: true
  name: ""